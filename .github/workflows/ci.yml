name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookdrop
          POSTGRES_PASSWORD: bookdrop
          POSTGRES_DB: bookdrop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookdrop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookdrop:bookdrop@localhost:5432/bookdrop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
