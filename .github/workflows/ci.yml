name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookdrop
          POSTGRES_PASSWORD: bookdrop
          POSTGRES_DB: bookdrop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookdrop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://bookdrop:bookdrop@localhost:5432/bookdrop
      JWT_ACCESS_SECRET: ci-dummy-test-jwt-access-secret-minimum-32-characters
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      SEED_ADMIN_PASSWORD: DummyAdminPassword123!
      SEED_LIBRARIAN_PASSWORD: DummyLibrarianPassword123!
      SEED_MEMBER_PASSWORD: DummyMemberPassword123!
      TRUST_PROXY: "false"
      ALLOWED_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  docker-build:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with layer caching
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bookdrop-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for HIGH vulnerabilities (report only)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'bookdrop-api:test'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Scan image for CRITICAL vulnerabilities (fail on findings)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'bookdrop-api:test'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

