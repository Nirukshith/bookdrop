name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookdrop
          POSTGRES_PASSWORD: bookdrop
          POSTGRES_DB: bookdrop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookdrop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: bookdrop
          RABBITMQ_DEFAULT_PASS: bookdrop
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://bookdrop:bookdrop@localhost:5432/bookdrop?connection_limit=25
      RABBITMQ_URL: amqp://bookdrop:bookdrop@localhost:5672
      JWT_ACCESS_SECRET: ci-dummy-test-jwt-access-secret-minimum-32-characters
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      SEED_ADMIN_PASSWORD: DummyAdminPassword123!
      SEED_LIBRARIAN_PASSWORD: DummyLibrarianPassword123!
      SEED_MEMBER_PASSWORD: DummyMemberPassword123!
      TRUST_PROXY: "false"
      ALLOWED_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify Notifications Microservice
        run: |
          cd services/notifications-service
          npm ci
          npx prisma generate
          npm test
          npm run test:e2e
          npm run build
      - name: Verify Identity Subgraph
        run: |
          cd services/identity-service
          npm ci
          npx prisma generate
          npm test
          npm run build
      - name: Verify Apollo Gateway
        run: |
          cd services/gateway
          npm ci
          npm test
          npm run build
      - name: Run Monolith & Supergraph E2E Tests
        run: npm run test:e2e
      - name: Verify Web Frontend
        run: |
          cd web
          npm ci
          npm run lint
          npm run build

  docker-build:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with layer caching
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bookdrop-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Notifications Microservice Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/notifications-service
          platforms: linux/amd64
          load: true
          tags: bookdrop-notifications-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for HIGH vulnerabilities (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'bookdrop-api:test'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Scan image for CRITICAL vulnerabilities (fail on findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'bookdrop-api:test'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

  k8s-lint:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Create Kind cluster for validation
        run: kind create cluster --name k8s-validation

      - name: Dry-run validate all K8s manifests
        run: |
          echo "Validating namespace and infrastructure..."
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/secrets.yaml
          kubectl apply --dry-run=client -f k8s/postgres.yaml
          kubectl apply --dry-run=client -f k8s/rabbitmq.yaml
          kubectl apply --dry-run=client -f k8s/migration-job.yaml

          echo "Validating microservice deployments..."
          kubectl apply --dry-run=client -f k8s/identity-deployment.yaml
          kubectl apply --dry-run=client -f k8s/library-core-deployment.yaml
          kubectl apply --dry-run=client -f k8s/notifications-deployment.yaml
          kubectl apply --dry-run=client -f k8s/gateway-deployment.yaml

          echo "Validating HPA..."
          kubectl apply --dry-run=client -f k8s/hpa.yaml

          echo "Validating legacy monolith manifests (backward compat)..."
          kubectl apply --dry-run=client -f k8s/deployment.yaml
          kubectl apply --dry-run=client -f k8s/service.yaml

          echo "All K8s manifests are valid"
