name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookdrop
          POSTGRES_PASSWORD: bookdrop
          POSTGRES_DB: bookdrop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookdrop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://bookdrop:bookdrop@localhost:5432/bookdrop
      JWT_ACCESS_SECRET: ci-dummy-test-jwt-access-secret-minimum-32-characters
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      SEED_ADMIN_PASSWORD: DummyAdminPassword123!
      SEED_LIBRARIAN_PASSWORD: DummyLibrarianPassword123!
      SEED_MEMBER_PASSWORD: DummyMemberPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
