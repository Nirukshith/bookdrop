name: Deploy to AWS ECS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA)'
        required: true
        default: 'main'
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  preflight:
    name: Preflight Health & Capacity Check
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify RDS PostgreSQL and ECS Cluster Capacity
        run: |
          echo "Checking RDS instance status..."
          RDS_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier bookdrop-db \
            --region ap-south-1 \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text 2>/dev/null || echo "not-found")
          
          echo "Checking ECS cluster registered container instance capacity..."
          CONTAINER_CAPACITY=$(aws ecs describe-clusters \
            --clusters bookdrop-cluster \
            --region ap-south-1 \
            --query "clusters[0].registeredContainerInstancesCount" \
            --output text 2>/dev/null || echo "0")
          
          echo "RDS Status: $RDS_STATUS"
          echo "Registered ECS Container Instances: $CONTAINER_CAPACITY"

          if [ "$RDS_STATUS" != "available" ] || [ "$CONTAINER_CAPACITY" -lt 1 ]; then
            echo "::error::AWS is stopped. Run scripts/aws-up.sh first."
            echo "Preflight failure: RDS status is '$RDS_STATUS' (expected: 'available') and ECS cluster capacity is $CONTAINER_CAPACITY (expected: >= 1)."
            exit 1
          fi

          echo "Preflight check passed: RDS is available and ECS cluster has host capacity."

  deploy:
    name: Build, Migrate & Deploy
    needs: preflight
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bookdrop-api
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Building image for commit: $COMMIT_SHA"
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Prisma Database Migrations Task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster bookdrop-cluster \
            --task-definition bookdrop-migration-task:1 \
            --launch-type EC2 \
            --query "tasks[0].taskArn" \
            --output text)
          
          echo "Migration task launched: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster bookdrop-cluster --tasks $TASK_ARN
          
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster bookdrop-cluster \
            --tasks $TASK_ARN \
            --query "tasks[0].containers[0].exitCode" \
            --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migrations completed successfully!"

      - name: Deploy to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster bookdrop-cluster \
            --service bookdrop-api-service \
            --force-new-deployment
          
          aws ecs wait services-stable \
            --cluster bookdrop-cluster \
            --services bookdrop-api-service
          
          echo "Deployment completed successfully!"

      - name: Smoke Test Readiness Health Check
        env:
          HEALTH_URL: http://bookdrop-alb-1343440666.ap-south-1.elb.amazonaws.com/health/ready
        run: |
          echo "Smoke testing public endpoint: $HEALTH_URL"
          MAX_ATTEMPTS=24
          ATTEMPT=0
          HEALTHY=false
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Smoke test passed! Received HTTP 200 OK from $HEALTH_URL"
              HEALTHY=true
              break
            fi
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Received HTTP $HTTP_CODE. Retrying in 5s..."
            sleep 5
          done

          if [ "$HEALTHY" = false ]; then
            echo "::error::Smoke test failed: $HEALTH_URL failed to return HTTP 200 within $((MAX_ATTEMPTS * 5)) seconds."
            exit 1
          fi
