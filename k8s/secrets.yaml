apiVersion: v1
kind: Secret
metadata:
  name: bookdrop-secrets
  namespace: bookdrop
type: Opaque
stringData:
  DATABASE_URL: "postgresql://bookdrop:bookdrop@postgres-service:5432/bookdrop?schema=public"
  JWT_ACCESS_SECRET: "k8s-local-testing-jwt-secret-key-minimum-32-chars-long"
  SEED_ADMIN_PASSWORD: "AdminPassword123!"
  SEED_LIBRARIAN_PASSWORD: "LibrarianPassword123!"
  SEED_MEMBER_PASSWORD: "MemberPassword123!"
