# Library Core — Deployment + ClusterIP Service
# Handles books, loans, holds, reservations (subgraph on port 3002)
# HPA targets this Deployment (min:2, max:5)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-core
  namespace: bookdrop
  labels:
    app: library-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-core
  template:
    metadata:
      labels:
        app: library-core
    spec:
      containers:
        - name: library-core
          image: bookdrop-api:k8s-local
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
              name: graphql
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
            - name: TRUST_PROXY
              value: "true"
            - name: ALLOWED_ORIGINS
              value: "*"
            # Flags to run only as a library-core subgraph (no auth, no notifications modules)
            - name: IDENTITY_SERVICE_STANDALONE
              value: "true"
            - name: NOTIFICATIONS_SERVICE_STANDALONE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bookdrop-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookdrop-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookdrop-secrets
                  key: JWT_REFRESH_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: bookdrop-secrets
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "200Mi"
              cpu: "150m"
            limits:
              memory: "500Mi"
              cpu: "700m"
---
apiVersion: v1
kind: Service
metadata:
  name: library-core
  namespace: bookdrop
  labels:
    app: library-core
spec:
  type: ClusterIP
  selector:
    app: library-core
  ports:
    - name: graphql
      port: 3002
      targetPort: 3002

