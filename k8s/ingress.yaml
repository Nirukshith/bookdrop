# Bookdrop Unified Ingress — NGINX Ingress Controller
# Routes clean domains and fallback paths to microservices and dashboards
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookdrop-ingress
  namespace: bookdrop
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
spec:
  ingressClassName: nginx
  rules:
    # 1. Patron & Staff Web Portal
    - host: app.bookdrop.local
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000

    # 2. Apollo Supergraph GraphQL API & Health
    - host: api.bookdrop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000

    # 3. Jaeger Distributed Tracing Dashboard
    - host: tracing.bookdrop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-service
                port:
                  number: 16686

    # 4. Localhost Fallback Rules (works immediately on http://localhost or http://localhost:8080)
    - http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-service
                port:
                  number: 3000

