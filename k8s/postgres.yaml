apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bookdrop
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "bookdrop"
            - name: POSTGRES_PASSWORD
              value: "bookdrop"
            - name: POSTGRES_DB
              value: "bookdrop"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bookdrop", "-d", "bookdrop"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bookdrop", "-d", "bookdrop"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: bookdrop
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
