apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookdrop-api
  namespace: bookdrop
  labels:
    app: bookdrop-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookdrop-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bookdrop-api
    spec:
      containers:
        - name: api
          image: bookdrop-api:k8s-local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: TRUST_PROXY
              value: "true"
            - name: ALLOWED_ORIGINS
              value: "*"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bookdrop-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookdrop-secrets
                  key: JWT_ACCESS_SECRET
          resources:
            requests:
              memory: "150Mi"
              cpu: "100m"
            limits:
              memory: "350Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
