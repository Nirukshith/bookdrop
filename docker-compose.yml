services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookdrop
      POSTGRES_PASSWORD: bookdrop
      POSTGRES_DB: bookdrop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookdrop -d bookdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bookdrop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bookdrop
      RABBITMQ_DEFAULT_PASS: bookdrop
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  library-core:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: bookdrop-library-core:latest
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: "postgresql://bookdrop:bookdrop@db:5432/bookdrop?schema=public"
      RABBITMQ_URL: "amqp://bookdrop:bookdrop@rabbitmq:5672"
      IDENTITY_SERVICE_STANDALONE: "true"
      NOTIFICATIONS_SERVICE_STANDALONE: "true"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-default-super-secret-jwt-access-key-min-32-chars-long}"
      JWT_ACCESS_TTL: "15m"
      REFRESH_TOKEN_TTL_DAYS: 7
      TRUST_PROXY: "false"
      ALLOWED_ORIGINS: ""
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-service:
    profiles: ["app"]
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    image: bookdrop-identity-service:latest
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://bookdrop:bookdrop@db:5432/bookdrop?schema=public"
      RABBITMQ_URL: "amqp://bookdrop:bookdrop@rabbitmq:5672"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-default-super-secret-jwt-access-key-min-32-chars-long}"
      JWT_ACCESS_TTL: "15m"
      REFRESH_TOKEN_TTL_DAYS: 7
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    profiles: ["app"]
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    image: bookdrop-gateway:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      IDENTITY_SUBGRAPH_URL: "http://identity-service:3001/graphql"
      LIBRARY_CORE_SUBGRAPH_URL: "http://library-core:3002/graphql"
    ports:
      - "3000:3000"
    depends_on:
      - identity-service
      - library-core

  notifications-service:
    profiles: ["app", "notifications"]
    build:
      context: ./services/notifications-service
      dockerfile: Dockerfile
    image: bookdrop-notifications-service:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://bookdrop:bookdrop@db:5432/bookdrop?schema=public"
      RABBITMQ_URL: "amqp://bookdrop:bookdrop@rabbitmq:5672"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-console}"
      EMAIL_FROM: "${EMAIL_FROM:-Bookdrop Library <no-reply@bookdrop.io>}"
      NOTIFICATION_LOCK_SECONDS: 120
      NOTIFICATION_BATCH_SIZE: 20
      NOTIFICATION_RATE_LIMIT_RPS: 1
      NOTIFICATION_BURST_CAPACITY: 5
      SCHEDULER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq_data:
